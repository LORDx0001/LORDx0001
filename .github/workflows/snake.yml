name: Generate Snake

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Make background black
        run: |
          echo "=== Making background black ==="
          
          # Create CSS to override background
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              
              # Add black background style
              sed -i '/<svg[^>]*>/a <defs><style>.background{fill:#000000 !important;}</style></defs><rect width="100%" height="100%" fill="#000000" class="background"/>' "$file"
              
              # Replace common white fills
              sed -i 's/fill="white"/fill="#000000"/g' "$file"
              sed -i 's/fill="#ffffff"/fill="#000000"/g' "$file"
              sed -i 's/fill="#ebedf0"/fill="#161b22"/g' "$file"
              
              echo "Completed processing $file"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
