name: Generate Snake Animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main
    paths:
    - '.github/workflows/snake.yml'

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate snake animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Add black background without breaking XML structure
      - name: Add black background
        run: |
          echo "=== Adding black background ==="
          
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              
              # Use a more reliable method to insert the black background
              # Find the line with the opening svg tag and insert background after it
              awk '
                /<svg[^>]*>/ {
                  print $0
                  print "<rect width=\"100%\" height=\"100%\" fill=\"#000000\"/>"
                  next
                }
                { print }
              ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              
              # Replace light theme colors with dark ones
              sed -i 's/fill="#ebedf0"/fill="#161b22"/g' "$file"
              sed -i 's/fill="#f0f6fc"/fill="#0d1117"/g' "$file"
              sed -i 's/--ce:#ebedf0/--ce:#161b22/g' "$file"
              sed -i 's/--cb:#1b1f230a/--cb:#000000/g' "$file"
              
              echo "Completed processing $file"
            fi
          done

      # Deploy to output branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true