name: Generate Snake

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Make background black
        run: |
          echo "=== Making background black ==="
          
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              
              # Create a backup
              cp "$file" "$file.backup"
              
              # Extract the viewBox and dimensions from the original SVG
              VIEWBOX=$(grep -o 'viewBox="[^"]*"' "$file")
              WIDTH=$(grep -o 'width="[^"]*"' "$file")
              HEIGHT=$(grep -o 'height="[^"]*"' "$file")
              
              # Create a new SVG with black background
              echo "Creating new SVG with black background"
              
              # Start with SVG opening tag and black background
              echo "<svg $VIEWBOX $WIDTH $HEIGHT xmlns=\"http://www.w3.org/2000/svg\">" > "$file.new"
              echo "<rect width=\"100%\" height=\"100%\" fill=\"#000000\"/>" >> "$file.new"
              
              # Extract everything between <svg> and </svg> from original, excluding the opening svg tag
              sed -n '/<svg[^>]*>/,/<\/svg>/p' "$file.backup" | sed '1d;$d' >> "$file.new"
              
              # Close the SVG
              echo "</svg>" >> "$file.new"
              
              # Replace the original with the new version
              mv "$file.new" "$file"
              
              # Apply color replacements
              sed -i 's/fill="#ebedf0"/fill="#161b22"/g' "$file"
              sed -i 's/fill="#f0f6fc"/fill="#0d1117"/g' "$file"
              sed -i 's/--ce:#ebedf0/--ce:#161b22/g' "$file"
              sed -i 's/--cb:#1b1f230a/--cb:#000000/g' "$file"
              
              echo "Completed processing $file"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
