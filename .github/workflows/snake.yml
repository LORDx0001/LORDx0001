name: Generate Snake

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Make background black
        run: |
          echo "=== Making background black ==="
          
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              
              # First, let's see the current structure
              echo "First 5 lines of $file:"
              head -5 "$file"
              
              # Insert black background rect after the style tag ends, before any other elements
              sed -i '/<\/style>/a <rect width="100%" height="100%" fill="#000000" opacity="1"/>' "$file"
              
              # Replace common white/light fills with black/dark equivalents
              sed -i 's/fill="white"/fill="#000000"/g' "$file"
              sed -i 's/fill="#ffffff"/fill="#000000"/g' "$file"
              sed -i 's/fill="#ebedf0"/fill="#161b22"/g' "$file"
              sed -i 's/fill="#f0f6fc"/fill="#0d1117"/g' "$file"
              
              # Ensure the background color variables are dark
              sed -i 's/--ce:#ebedf0/--ce:#161b22/g' "$file"
              sed -i 's/--cb:#1b1f230a/--cb:#000000/g' "$file"
              
              echo "After processing, first 10 lines:"
              head -10 "$file"
              echo "Completed processing $file"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
