name: Generate Snake

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Make background black
        run: |
          # First, let's see what we're working with
          echo "=== Inspecting SVG structure ==="
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              echo "File: $file"
              head -20 "$file"
              echo "--- End of first 20 lines ---"
            fi
          done
          
          # Replace white background with black in both SVG files
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              # Replace various white background patterns
              sed -i 's/fill="white"/fill="#000000"/g' "$file"
              sed -i 's/fill="#ffffff"/fill="#000000"/g' "$file"
              sed -i 's/fill="#FFFFFF"/fill="#000000"/g' "$file"
              sed -i 's/fill="rgb(255,255,255)"/fill="#000000"/g' "$file"
              sed -i 's/fill="rgb(255, 255, 255)"/fill="#000000"/g' "$file"
              # Replace rect elements that might be background
              sed -i 's/<rect[^>]*fill="[^"]*"[^>]*class="[^"]*day[^"]*"/<rect fill="#000000" class="day"/g' "$file"
              # Add a black background rect at the start if needed
              sed -i '/<svg[^>]*>/a <rect width="100%" height="100%" fill="#000000"/>' "$file"
              echo "Processed $file"
            fi
          done
          
          # List files to verify
          ls -la dist/

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
